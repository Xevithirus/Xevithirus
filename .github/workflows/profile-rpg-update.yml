name: Profile RPG Update

permissions:
  contents: write

on:
  schedule:
    - cron: '55 23 * * *'
      timezone: 'Pacific/Auckland'

  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Calculate EXP and update README
        run: python update_readme.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit updated character stats
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add README.md
          git add total_exp.json
          git add total_exp_backup.json
          git add log.txt

          if git diff --cached --quiet; then
            echo "No profile changes to commit."
            exit 0
          fi

          git commit -m "chore: auto-update character EXP"

          git pull --rebase origin main
          git push origin main
